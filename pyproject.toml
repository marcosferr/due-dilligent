[project]
name = "due-dilligent"
version = "0.1.0"
description = "Sistema agéntico de due diligence de proveedores (Hackatón UNI · Desafío 3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
captura = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
dd = "dd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
